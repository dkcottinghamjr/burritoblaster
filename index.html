<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#2a1208" />
  <title>Burrito Blaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #2a1208;
      --bg-2: #501e0a;
      --accent: #fff45a;
      --accent-2: #ff5a3c;
      --ink: #2a0a04;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-1) 70%);
      font-family: 'Fredoka', system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Stage = aspect-correct frame around the canvas. Fits to either
       viewport width or height, whichever constrains harder. */
    #stage {
      position: relative;
      width: min(100%, calc((100dvh - var(--safe-t) - var(--safe-b)) * 1200 / 650));
      max-width: 100%;
      aspect-ratio: 1200 / 650;
      border-radius: clamp(0px, 1.4vw, 16px);
      overflow: hidden;
      box-shadow: 0 8px 0 #5a1a0a, 0 0 0 4px #ffd55a, 0 0 0 8px rgba(0,0,0,0.25);
      background: #ffe29a;
    }

    canvas#game {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    /* HUD overlays the top of the canvas. Fades to transparent so the
       sky shows through. */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: clamp(6px, 1.5vw, 14px);
      gap: 8px;
      z-index: 5;
      background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      font-family: 'Bangers', 'Impact', sans-serif;
    }
    .hud-side {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 0 0 auto;
    }
    .hud-side.right { justify-content: flex-end; }
    .hud-side .pill {
      background: rgba(20, 8, 4, 0.55);
      border: 2px solid #ffd55a;
      border-radius: 999px;
      padding: 4px 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(16px, 2.4vw, 24px);
      color: #fff45a;
      text-shadow: 2px 2px 0 #5a1a0a;
      line-height: 1;
    }
    .hud-side .pill .label {
      font-size: clamp(10px, 1.4vw, 14px);
      color: #ffeec7;
      letter-spacing: 1px;
    }
    .hud-emoji { font-size: clamp(16px, 2.4vw, 24px); }

    .chips-pill { border-color: #f4c542; }
    .chip-icon {
      display: inline-block;
      width: clamp(14px, 2vw, 20px);
      height: clamp(13px, 1.9vw, 18px);
      background: linear-gradient(135deg, #f7d160 0%, #c98a2a 100%);
      clip-path: polygon(50% 6%, 6% 94%, 94% 94%);
      filter: drop-shadow(1px 1px 0 #6a3e0e);
    }
    #chipsCount {
      display: inline-block;
      min-width: 32px;
      text-align: right;
      transform-origin: center;
    }
    #chipsCount.pulse {
      animation: chipPulse 300ms ease;
    }
    @keyframes chipPulse {
      0%   { transform: scale(1);   color: #fff45a; text-shadow: 2px 2px 0 #5a1a0a; }
      35%  { transform: scale(1.35); color: #ffffff; text-shadow: 0 0 12px #fff45a, 2px 2px 0 #5a1a0a; }
      100% { transform: scale(1);   color: #fff45a; text-shadow: 2px 2px 0 #5a1a0a; }
    }

    .card .bonus {
      font-family: 'Bangers', 'Impact', sans-serif;
      font-size: clamp(20px, 3.4vw, 28px);
      letter-spacing: 2px;
      color: #9ee85a;
      text-shadow: 2px 2px 0 #14280a;
      margin: 4px 0 6px 0;
      animation: bonusBob 700ms ease-in-out infinite alternate;
    }
    @keyframes bonusBob {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }
    .card .run {
      font-size: clamp(13px, 2vw, 16px);
      color: #ffeec7;
      margin: 0 0 6px 0;
    }
    .hud-center {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }
    .hud-title {
      font-size: clamp(18px, 3.4vw, 30px);
      letter-spacing: 3px;
      color: #fff45a;
      text-shadow: 3px 3px 0 #5a1a0a, 0 0 18px rgba(255, 244, 90, 0.6);
      line-height: 1;
      white-space: nowrap;
    }
    .hud-level {
      font-size: clamp(11px, 1.6vw, 16px);
      letter-spacing: 2px;
      color: #ffeec7;
      text-shadow: 2px 2px 0 #5a1a0a;
      text-align: center;
      max-width: 60vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hud-pace {
      font-size: clamp(12px, 1.8vw, 16px);
      letter-spacing: 4px;
      color: #ffd55a;
      text-shadow: 1px 1px 0 #5a1a0a;
      line-height: 1;
    }
    .menu-btn {
      pointer-events: auto;
      width: clamp(40px, 6vw, 52px);
      height: clamp(40px, 6vw, 52px);
      font-size: clamp(20px, 3vw, 26px);
      font-family: 'Bangers', 'Impact', sans-serif;
      background: rgba(20, 8, 4, 0.55);
      color: #fff45a;
      border: 2px solid #ffd55a;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #5a1a0a;
      transition: transform 80ms ease, box-shadow 80ms ease;
    }
    .menu-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a1a0a; }

    /* Modal overlays (win/lose card + level menu) */
    .modal {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 8, 4, 0.55);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 20;
      padding: 4vh 4vw;
      transition: opacity 180ms ease;
    }
    .modal.hidden { opacity: 0; pointer-events: none; }

    .card {
      background: linear-gradient(180deg, #ff7a3c, #a8121a);
      border: 4px solid #ffd55a;
      border-radius: 18px;
      padding: clamp(18px, 3vw, 28px) clamp(22px, 4vw, 44px);
      text-align: center;
      box-shadow: 0 10px 0 #3a0a04, 0 0 0 4px rgba(0,0,0,0.2) inset;
      max-width: min(440px, 92%);
      max-height: 92%;
      overflow: auto;
    }
    .card h1 {
      font-family: 'Bangers', 'Impact', sans-serif;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: 2px;
      color: #fff45a;
      margin: 0 0 10px 0;
      text-shadow: 3px 3px 0 #5a1a0a;
    }
    .stars {
      font-size: clamp(36px, 7vw, 56px);
      color: #fff45a;
      letter-spacing: 6px;
      margin: 4px 0 10px 0;
      text-shadow: 2px 2px 0 #5a1a0a;
    }
    .card p {
      margin: 0 0 6px 0;
      font-size: clamp(14px, 2vw, 18px);
      color: #ffeec7;
    }
    .card .hint {
      margin: 0 0 18px 0;
      font-size: clamp(12px, 1.8vw, 14px);
      color: #ffd55a;
      letter-spacing: 1px;
      font-style: italic;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card button {
      font-family: 'Bangers', 'Impact', sans-serif;
      font-size: clamp(18px, 2.8vw, 26px);
      letter-spacing: 3px;
      padding: clamp(10px, 1.6vw, 14px) clamp(20px, 3vw, 32px);
      min-height: 48px; /* iOS recommended min touch target */
      color: #2a0a04;
      background: linear-gradient(180deg, #ffd55a, #f4a019);
      border: 3px solid #5a1a0a;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0 #5a1a0a;
      transition: transform 80ms ease, box-shadow 80ms ease;
    }
    .card button:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a1a0a; }
    .card button#nextBtn {
      background: linear-gradient(180deg, #9ee85a, #4a9e1a);
      color: #14280a;
    }

    /* Levels menu list */
    #levelList {
      list-style: none;
      margin: 4px 0 18px 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .level-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      min-height: 48px;
      background: rgba(255, 213, 90, 0.18);
      border: 2px solid rgba(255, 213, 90, 0.5);
      border-radius: 10px;
      cursor: pointer;
      transition: background 100ms ease, transform 80ms ease;
    }
    .level-row:active { transform: scale(0.98); background: rgba(255, 213, 90, 0.32); }
    .level-row.current {
      border-color: #fff45a;
      background: rgba(255, 244, 90, 0.22);
    }
    .level-num {
      font-family: 'Bangers', 'Impact', sans-serif;
      color: #fff45a;
      font-size: 22px;
      width: 28px;
      text-align: center;
      text-shadow: 2px 2px 0 #5a1a0a;
    }
    .level-name {
      font-family: 'Bangers', 'Impact', sans-serif;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: #fff;
      text-shadow: 2px 2px 0 #5a1a0a;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .level-stars {
      font-size: 18px;
      color: #fff45a;
      text-shadow: 1px 1px 0 #5a1a0a;
      letter-spacing: 2px;
    }
    .level-row.locked {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .level-row.locked:active { transform: none; background: rgba(255, 213, 90, 0.18); }
    .menu-total {
      font-family: 'Bangers', 'Impact', sans-serif;
      font-size: clamp(16px, 2.4vw, 22px);
      letter-spacing: 3px;
      color: #ffd55a;
      text-shadow: 2px 2px 0 #5a1a0a;
      margin: 0 0 12px 0;
    }
    .newbest {
      font-family: 'Bangers', 'Impact', sans-serif;
      font-size: clamp(20px, 3.2vw, 28px);
      letter-spacing: 3px;
      color: #ff9df5;
      text-shadow: 2px 2px 0 #5a0a4a, 0 0 14px rgba(255, 157, 245, 0.7);
      margin: 0 0 4px 0;
      animation: newBestPop 450ms cubic-bezier(0.2, 1.6, 0.4, 1);
    }
    @keyframes newBestPop {
      0%   { transform: scale(0.2) rotate(-6deg); opacity: 0; }
      70%  { transform: scale(1.15) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Portrait rotate prompt — only on small portrait viewports */
    #rotatePrompt {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, var(--bg-2), var(--bg-1));
      z-index: 100;
    }
    .rotate-card {
      background: linear-gradient(180deg, #ff7a3c, #a8121a);
      border: 4px solid #ffd55a;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 340px;
      box-shadow: 0 10px 0 #3a0a04;
    }
    .rotate-icon {
      font-size: 58px;
      animation: rotateNudge 2s ease-in-out infinite;
      transform-origin: center;
      display: inline-block;
      margin-bottom: 10px;
    }
    @keyframes rotateNudge {
      0%, 50%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-15deg); }
      30% { transform: rotate(-90deg); }
      40% { transform: rotate(-90deg); }
    }
    .rotate-card h2 {
      font-family: 'Bangers', 'Impact', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: #fff45a;
      margin: 6px 0 8px 0;
      text-shadow: 3px 3px 0 #5a1a0a;
    }
    .rotate-card p {
      margin: 0;
      font-size: 15px;
      color: #ffeec7;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #app { display: none; }
      #rotatePrompt { display: flex; }
    }

    /* Very small screens: tighten the HUD even more so it doesn't crowd the burrito */
    @media (max-width: 480px) {
      .hud-title { display: none; }
      .hud-level { font-size: 12px; }
      #hud { padding: 6px 8px; }
      .hud-side .pill { padding: 3px 8px; }
    }
  </style>
</head>
<body>
  <div id="rotatePrompt">
    <div class="rotate-card">
      <div class="rotate-icon">📱</div>
      <h2>Rotate to play</h2>
      <p>Burrito Blaster lives in landscape. Turn your device sideways.</p>
    </div>
  </div>

  <div id="app">
    <div id="stage">
      <canvas id="game" width="1200" height="650"></canvas>

      <header id="hud">
        <div class="hud-side left">
          <div class="pill">
            <span class="label">BURRITOS</span>
            <span id="burritosLeft">3</span>
            <span class="hud-emoji">🌯</span>
          </div>
          <div class="pill chips-pill">
            <span class="label">CHIPS</span>
            <span id="chipsCount">0</span>
            <span class="chip-icon" aria-hidden="true"></span>
          </div>
        </div>
        <div class="hud-center">
          <div class="hud-title">BURRITO BLASTER</div>
          <div id="levelLabel" class="hud-level">LEVEL 1 / 5</div>
          <div id="paceStars" class="hud-pace" title="Stars you're on pace for">★★★</div>
        </div>
        <div class="hud-side right">
          <div class="pill">
            <span class="label">BEST</span>
            <span id="bestStars">☆☆☆</span>
          </div>
          <button id="muteBtn" class="menu-btn" aria-label="Mute audio and haptics" aria-pressed="false">🔊</button>
          <button id="menuBtn" class="menu-btn" aria-label="Levels menu">☰</button>
        </div>
      </header>

      <div id="overlay" class="modal hidden">
        <div class="card">
          <h1 id="overlayTitle">Level Complete</h1>
          <div id="overlayNewBest" class="newbest" style="display:none;">NEW BEST!</div>
          <div id="overlayStars" class="stars">★★★</div>
          <p id="overlaySub">Nice shot, blaster.</p>
          <p id="overlayRun" class="run">&nbsp;</p>
          <p id="overlayBonus" class="bonus" style="display:none;"></p>
          <p id="overlayHint" class="hint">&nbsp;</p>
          <div class="buttons">
            <button id="retryBtn">RETRY</button>
            <button id="nextBtn">NEXT LEVEL</button>
          </div>
        </div>
      </div>

      <div id="menuOverlay" class="modal hidden">
        <div class="card">
          <h1>LEVELS</h1>
          <p id="menuTotalStars" class="menu-total">★ 0 / 15</p>
          <ul id="levelList"></ul>
          <div class="buttons">
            <button id="menuCloseBtn">CLOSE</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="config.js"></script>
  <script src="audio.js"></script>
  <script src="haptics.js"></script>
  <script src="model.js"></script>
  <script src="view.js"></script>
  <script src="controller.js"></script>
  <script>
    (function bootstrap() {
      const canvas = document.getElementById('game');
      View.init(canvas);
      Controller.init(canvas);
    })();
  </script>
</body>
</html>
